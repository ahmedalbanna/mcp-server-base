# Override for v2.1 OTEL + v3.0 Prometheus/Grafana (optional)
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: mcp-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health
    restart: unless-stopped

  app:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      ADMIN_ENABLED: "true"
      # v3.0 enterprise
      CLUSTER_MODE: "false" # enable for multi-worker scale
    depends_on:
      - otel-collector

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mcp-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mcp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
